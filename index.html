<!doctype html>
<html lang="en" data-mode="cozy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FDF6EC" />
    <meta
      name="description"
      content="Rainlet — a cute pixel pet in the rain, for Kindle and other e-ink readers."
    />
    <title>Rainlet</title>
  </head>
  <body>
    <!-- Backdrop layers: optional custom video/gif, then the canvas rain. -->
    <div class="backdrop" aria-hidden="true">
      <div class="backdrop__media" id="backdrop-media"></div>
      <div class="backdrop__scrim" id="backdrop-scrim"></div>
      <canvas class="backdrop__rain" id="rain"></canvas>
    </div>

    <div class="shell">
      <header class="topbar">
        <div class="topbar__brand">
          <button
            class="mascot"
            id="mascot"
            type="button"
            aria-label="Pet the cat"
            title="Pet the cat"
          ></button>
          <span class="topbar__name">Rainlet</span>
        </div>

        <div class="topbar__status">
          <button
            class="chip chip--clock"
            id="clock"
            type="button"
            title="Toggle 12/24 hour"
          >
            <span id="clock-time">--:--</span>
          </button>
          <button
            class="chip chip--icon"
            id="open-settings"
            type="button"
            aria-label="Settings"
          >
            <span data-icon="gear"></span>
          </button>
        </div>
      </header>

      <main class="content">
        <!-- Pet stage ------------------------------------------------------>
        <article class="card card--stage">
          <header class="card__head">
            <h2 class="card__title">Rain friend</h2>
            <span class="muted" id="pet-hint"></span>
          </header>

          <button
            class="stage"
            id="pet-stage"
            type="button"
            aria-label="Pet the animal"
            title="Give them a pat"
          ></button>

          <div class="chips" id="pet-chips"></div>

          <!-- Shown only when the page was opened from a shared pet link. -->
          <div class="gift" id="gift-bar" hidden>
            <span class="gift__text" id="gift-text">
              Someone sent you a friend.
            </span>
            <button class="btn" id="gift-keep" type="button">Keep them</button>
            <button class="btn btn--quiet" id="gift-drop" type="button">
              No thanks
            </button>
          </div>
        </article>

      </main>

      <footer class="footer">
        <span>Made with pixel rain · everything stays on your device</span>
      </footer>
    </div>

    <!-- Settings panel -->
    <div class="overlay" id="settings-panel" hidden>
      <div
        class="panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <header class="panel__head">
          <h2 id="settings-title">Settings</h2>
          <button
            class="pbtn"
            id="close-settings"
            type="button"
            aria-label="Close"
          >
            <span data-icon="close"></span>
          </button>
        </header>

        <div class="settings" id="settings-body"></div>

        <footer class="panel__foot">
          <span class="muted" id="about-line"></span>
          <button class="btn btn--quiet" id="reset-prefs" type="button">
            Reset preferences
          </button>
        </footer>
      </div>
    </div>

    <!-- Pet maker panel -->
    <div class="overlay" id="maker-panel" hidden>
      <div
        class="panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="maker-title"
      >
        <header class="panel__head">
          <h2 id="maker-title">Make a friend</h2>
          <button
            class="pbtn"
            id="close-maker"
            type="button"
            aria-label="Close"
          >
            <span data-icon="close"></span>
          </button>
        </header>

        <div class="maker">
          <p class="muted" id="maker-hint">
            Draw with a finger, or turn a picture into pixels.
          </p>

          <div class="draw" id="maker-grid"></div>

          <div class="palette" id="maker-palette" aria-label="Colours"></div>

          <div class="maker__actions">
            <label class="btn btn--quiet" for="maker-file">Use a picture</label>
            <input
              class="visually-hidden"
              id="maker-file"
              type="file"
              accept="image/*"
            />
            <button class="btn btn--quiet" id="maker-clear" type="button">
              Start over
            </button>
            <button
              class="btn btn--quiet"
              id="maker-delete"
              type="button"
              hidden
            >
              Delete
            </button>
          </div>

          <!-- The link lives in a field as well as on the clipboard: the
               Kindle's browser has no clipboard API to copy with. -->
          <label class="link-out" id="maker-link-row" hidden>
            <span class="visually-hidden">Link to your friend</span>
            <input id="maker-link" type="text" readonly />
          </label>
        </div>

        <footer class="panel__foot">
          <span class="muted">Stays on this device.</span>
          <div class="maker__save">
            <button class="btn btn--quiet" id="maker-share" type="button">
              Share
            </button>
            <button class="btn" id="maker-save" type="button">
              Save friend
            </button>
          </div>
        </footer>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
